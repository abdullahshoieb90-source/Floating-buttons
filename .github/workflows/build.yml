name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test signature resolution on host
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Itests/stubs -Iinclude \
            tests/signature_resolver_test.cpp src/core/memory/Signatures.cpp -o /tmp/signature-test
          /tmp/signature-test

      - name: Test HUD editor integration on host
        run: |
          git clone --depth 1 https://github.com/LiteLDev/preloader-android.git /tmp/preloader-src
          git clone --depth 1 --branch v3.11.3 https://github.com/nlohmann/json.git /tmp/json-src
          PRELOADER_SOURCE=/tmp/preloader-src JSON_SOURCE=/tmp/json-src tests/run_hud_editor_test.sh

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build and package
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }}
          xmake -y

      - uses: actions/upload-artifact@v4
        with:
          name: FloatingCommandButtons-levipack
          path: build/android/arm64-v8a/release/FloatingCommandButtons.levipack
          if-no-files-found: error
